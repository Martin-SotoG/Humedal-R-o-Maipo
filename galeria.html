<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería - Humedal Río Maipo</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<nav>
    <div class="menu-toggle">☰</div>

    <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="info.html">Investigación</a>
        <a href="galeria.html">Galería</a>
        <a href="fuentes.html">Fuentes</a>
    </div>
</nav>

<section>
    <h2>Galería</h2>

    <div class="gallery">
        <img src="https://www.terram.cl/wp-content/uploads/2015/09/8123398443_de70e6dca3_b.jpg" alt="Vista aérea del Humedal Río Maipo">
        <img src="https://www.paiscircular.cl/wp-content/uploads/2025/05/IMG_4872-1024x559.jpg" alt="Paisaje del Humedal Río Maipo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Wetland.jpg" alt="Vista general de un humedal">
        <img src="https://www.monumentos.gob.cl/sites/default/files/styles/16x9_grande/public/image-monumentos/dji_0010.jpg?h=dbcb2112&itok=RD2-ishV" alt="Imagen aérea del santuario Humedal Río Maipo">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dji_0043.jpg" alt="Sector del Humedal Río Maipo">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dscn7450.jpg" alt="Aves en el Humedal Río Maipo">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dscn7502.jpg" alt="Ave en el Humedal Río Maipo">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dji_0003.jpg" alt="Vista aérea del Humedal Río Maipo">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dscn7572.jpg" alt="Grupo de aves en el humedal">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dscn7591.jpg" alt="Flora del Humedal Río Maipo">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dscn7571.jpg" alt="Aves en zona húmeda del humedal">
        <img src="https://www.monumentos.gob.cl/sites/default/files/image-monumentos/dscn7558.jpg" alt="Sendero del Humedal Río Maipo">
    </div>
</section>

<div id="visor" aria-hidden="true">
    <span class="cerrar" aria-label="Cerrar visor">&times;</span>
    <img id="imagen-ampliada" src="" alt="Imagen ampliada">
</div>

<footer>
    <div class="footer-content">
        <p>© 2026 Humedal Río Maipo | Proyecto educativo</p>

        <div class="footer-links">
            <a href="index.html">Inicio</a>
            <a href="info.html">Investigación</a>
            <a href="galeria.html">Galería</a>
            <a href="fuentes.html">Fuentes</a>
            <a href="descargo.html">Descargo</a>
        </div>
    </div>
</footer>

<script>
const toggle = document.querySelector(".menu-toggle");
const navLinks = document.querySelector(".nav-links");

if (toggle && navLinks) {
    toggle.addEventListener("click", () => {
        navLinks.classList.toggle("active");
    });
}

const imagenesGaleria = document.querySelectorAll(".gallery img");
const visor = document.getElementById("visor");
const imagenAmpliada = document.getElementById("imagen-ampliada");
const cerrar = document.querySelector(".cerrar");

imagenesGaleria.forEach(imagen => {
    imagen.addEventListener("click", () => {
        imagenAmpliada.src = imagen.src;
        imagenAmpliada.alt = imagen.alt || "Imagen ampliada";
        visor.classList.add("activo");
        visor.setAttribute("aria-hidden", "false");
    });
});

function cerrarVisor() {
    visor.classList.remove("activo");
    visor.setAttribute("aria-hidden", "true");
    imagenAmpliada.src = "";
}

if (cerrar) {
    cerrar.addEventListener("click", cerrarVisor);
}

if (visor) {
    visor.addEventListener("click", (e) => {
        if (e.target === visor) {
            cerrarVisor();
        }
    });
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && visor.classList.contains("activo")) {
        cerrarVisor();
    }
});
</script>

</body>
</html>
